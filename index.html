<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/scss/main.scss">
  <title>header-menu-dropdown</title>
</head>

<body>
  <header id="main-header">
    <div class="main-header-container">
      <div class="main-header-wrapper">
        <img class="logo" src="src/assets/javascript.svg">
        <div class="secondary-menu-wrapper">
          <div class="menu-wrapper">
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
          </div>
          <div class="header-button-wrapper">
            <button class="menu-toggle-button">
              <img class="icon" src="src/assets/list.svg" />
            </button>
          </div>
        </div>
      </div>
      <div class="main-header-background">
        <div class="menu-wrapper">
          <a href="#">Link</a>
          <a href="#">Link</a>
          <a href="#">Link</a>
          <a href="#">Link</a>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="container" style="margin-top: 100px;">
      <div class="progress-bar"></div>

      <div class="container">
        <h1 class="hero-title">Vite + Motion Sandbox</h1>
        <p class="hero-sub">Scroll down to see reveal & stagger effects.</p>

        <!-- Staggered Cards Section -->
        <section class="card-grid">
          <div class="card">Card 01</div>
          <div class="card">Card 02</div>
          <div class="card">Card 03</div>
          <div class="card">Card 04</div>
        </section>

        <div class="spacer"></div>

        <!-- Scroll Reveal Section -->
        <section class="reveal-box">
          <h2>Revealed on Scroll!</h2>
          <p>This box animated only after scrolling into the viewport.</p>
        </section>

        <div class="spacer"></div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
